<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wear Your Style | Streetwear</title>
<style>
:root {
  --bg:#f7f6f1;
  --ink:#171717;
  --muted:#777;
  --lime:#d9ff45;
  --white:#fff;
  --line:#e6e3dc;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.announcement{background:#171717;color:white;text-align:center;padding:11px;font-size:11px;letter-spacing:2px}
header{position:sticky;top:0;z-index:10;background:#f7f6f1ed;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
nav{max-width:1200px;margin:auto;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-size:21px;font-weight:900;letter-spacing:-1px}
.logo span{color:#789800}
.links{display:flex;gap:25px;font-size:13px;font-weight:bold}
.links a:hover{opacity:.6}
.bag,.menu{background:transparent;border:1px solid #171717;border-radius:30px;padding:11px 15px;font-size:12px;font-weight:bold}
.count{background:var(--lime);border-radius:50%;padding:4px 7px;margin-left:5px}
.menu{display:none}
.hero{max-width:1200px;margin:auto;padding:25px 22px 50px}
.hero-box{min-height:510px;border-radius:24px;display:flex;align-items:flex-end;overflow:hidden;position:relative;background:#777}
.hero-box:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,#0003),url("https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1800&q=85") center/cover}
.hero-text{position:relative;color:white;padding:clamp(25px,6vw,70px);max-width:700px}
.eyebrow{font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase}
.hero h1{font-size:clamp(52px,9vw,100px);line-height:.9;letter-spacing:-7px;margin:22px 0}
.hero p{max-width:420px;font-size:15px;line-height:1.8;color:#eee}
.btn{display:inline-block;background:var(--lime);border:0;border-radius:30px;padding:15px 22px;color:#171717;font-size:12px;font-weight:900;text-transform:uppercase}
.btn:hover{transform:translateY(-2px)}
.btn.dark{background:#171717;color:white}
.section{max-width:1200px;margin:auto;padding:40px 22px 60px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
.kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:bold}
h2{font-size:clamp(32px,5vw,48px);letter-spacing:-3px;margin:9px 0 0}
.heading p{max-width:350px;font-size:13px;line-height:1.7;color:var(--muted)}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.category{height:260px;position:relative;overflow:hidden;border-radius:16px;background:#ddd}
.category img{width:100%;height:100%;object-fit:cover;transition:.4s}
.category:hover img{transform:scale(1.06)}
.category:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000a,transparent 70%)}
.cat-text{position:absolute;z-index:1;bottom:18px;left:18px;color:white}
.cat-text h3{font-size:22px;margin:0 0 7px}
.cat-text p{font-size:11px;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:23px}
.filter{border:1px solid #d8d5ce;border-radius:30px;padding:10px 15px;background:transparent;font-size:12px;font-weight:bold}
.filter.active,.filter:hover{background:#171717;color:white}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.product-image{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#e5e3dc}
.product-image img{width:100%;height:100%;object-fit:cover;transition:.4s}
.product:hover img{transform:scale(1.04)}
.tag{position:absolute;top:12px;left:12px;background:white;padding:7px 10px;border-radius:30px;font-size:9px;font-weight:bold;text-transform:uppercase}
.add{position:absolute;bottom:12px;left:12px;width:calc(100% - 24px);border:0;background:white;border-radius:30px;padding:13px;font-size:11px;font-weight:900}
.add:hover{background:var(--lime)}
.product-info{padding:12px 2px}
.product-line{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:bold}
.product-info p{font-size:11px;color:var(--muted)}
.promo{max-width:1156px;margin:0 auto 60px;padding:0 22px}
.promo-box{background:var(--lime);border-radius:22px;padding:clamp(25px,5vw,55px);display:flex;align-items:center;justify-content:space-between;gap:25px}
.promo-box h2{max-width:550px}
.promo-box p{font-size:13px;line-height:1.8;max-width:500px}
.newsletter{background:#e9e7e0;text-align:center;padding:55px 20px}
.newsletter p{color:var(--muted);font-size:13px}
.newsletter form{display:flex;gap:8px;max-width:450px;margin:20px auto}
.newsletter input{flex:1;min-width:0;padding:14px;border:1px solid #ddd;border-radius:30px}
footer{background:#171717;color:white;padding:45px 22px 20px}
.footer-inner{max-width:1156px;margin:auto}
.footer-cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;padding-bottom:30px}
footer p,footer a{font-size:12px;color:#bbb;line-height:1.8}
footer h4{font-size:11px;text-transform:uppercase;letter-spacing:2px}
footer a{display:block;margin:8px 0}
.copyright{border-top:1px solid #444;padding-top:18px;color:#aaa;font-size:11px}
.overlay{position:fixed;inset:0;background:#0007;z-index:20;display:none}
.overlay.open{display:block}
.drawer{position:fixed;z-index:21;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{margin:0;font-size:24px}
.close{border:1px solid var(--line);background:white;border-radius:50%;width:38px;height:38px;font-size:20px}
.cart-items{padding:15px 22px;overflow:auto;flex:1}
.cart-item{display:grid;grid-template-columns:75px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:75px;height:90px;object-fit:cover;border-radius:9px}
.cart-item h4{font-size:12px;margin:3px 0 8px}
.cart-item p{font-size:12px;color:var(--muted)}
.qty{display:flex;gap:10px;align-items:center}
.qty button{border:1px solid var(--line);background:white;border-radius:50%;width:25px;height:25px}
.remove{border:0;background:none;text-decoration:underline;font-size:11px;margin-top:8px}
.cart-bottom{background:white;padding:20px 22px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:15px}
.cart-bottom .btn{width:100%;text-align:center}
.empty{text-align:center;padding:45px 5px;color:var(--muted);font-size:13px;line-height:1.7}
.modal-bg{position:fixed;z-index:30;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:18px;padding:25px;width:min(620px,100%);max-height:95vh;overflow:auto}
.modal-top{display:flex;justify-content:space-between;align-items:start;gap:15px}
.modal h3{font-size:27px;margin:0}
.modal p{font-size:12px;color:var(--muted);line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:bold}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d8d5ce;border-radius:9px;background:white}
.summary{white-space:pre-line;background:white;border:1px solid var(--line);padding:14px;border-radius:10px;font-size:12px;line-height:1.7;margin:15px 0}
.notice{font-size:11px;line-height:1.6;background:#fff4cc;padding:12px;border-radius:9px;margin:15px 0}
#success{display:none}
.toast{position:fixed;z-index:50;bottom:20px;left:50%;transform:translateX(-50%);background:#171717;color:white;border-radius:30px;padding:13px 18px;font-size:12px;display:none}
.toast.show{display:block}
@media(max-width:850px){
 .categories,.products{grid-template-columns:repeat(2,1fr)}
 .category{height:250px}
 .hero-box{min-height:450px}
 .links{gap:12px}
}
@media(max-width:600px){
 nav{padding:14px}
 .logo{font-size:17px}
 .menu{display:block}
 .links{display:none;position:absolute;top:60px;left:12px;right:12px;background:white;padding:12px;border-radius:12px;box-shadow:0 10px 30px #0001;flex-direction:column;gap:0}
 .links.open{display:flex}
 .links a{padding:12px;border-bottom:1px solid var(--line)}
 .hero
